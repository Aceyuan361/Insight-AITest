[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "insight-aitest"
version = "2.0.0"
description = "Insight-AITest — AI 驱动的测试与监控一体化平台 / AI-Powered Testing & Monitoring Platform"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Aceyuan361", email = "594902674@qq.com"}
]
maintainers = [
    {name = "Aceyuan361", email = "594902674@qq.com"}
]
keywords = [
    "testing",
    "automation",
    "ai",
    "ui-automation",
    "api-testing",
    "test-case",
    "monitoring",
    "performance",
    "android",
    "ios",
    "apm"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Testing",
    "Topic :: System :: Monitoring",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
]
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "websockets>=14.0",
    "pydantic>=2.0",
    "sqlalchemy>=2.0.0",
    "pymobiledevice3>=9.0.0",
    "psutil>=6.0.0",
    "sqlite-vec>=0.1",
    "pypdf>=4.0",
    "pymupdf>=1.24",
    "chardet>=5.0",
    "openai>=1.0",
    "python-docx>=1.0",
    "openpyxl>=3.1",
    "python-pptx>=0.6",
    "beautifulsoup4>=4.12",
    "python-multipart>=0.0.6",
    "jsonpath-ng>=1.6.0",
    "logzero>=1.7.0",
]

[project.optional-dependencies]
ui = [
    "playwright>=1.40.0",
    "pymidscene>=0.1.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.28.0",
    "black>=24.0.0",
    "ruff>=0.8.0",
    "reportlab>=4.0",
]

[project.urls]
Homepage = "https://github.com/Aceyuan361/Insight-AITest"
Documentation = "https://github.com/Aceyuan361/Insight-AITest/blob/2.0.0/docs"
Repository = "https://github.com/Aceyuan361/Insight-AITest"
Issues = "https://github.com/Aceyuan361/Insight-AITest/issues"

[project.scripts]
insight-aitest = "insight_aitest.__main__:main"

[tool.setuptools.packages.find]
include = ["insight_aitest*"]

[tool.setuptools.package-data]
"*" = ["dist/**/*", "*.html", "*.css", "*.js", "*.json"]

[tool.black]
line-length = 100
target-version = ['py310', 'py311', 'py312']

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "live: 真实 API key 测试（CI 跳过，本地手跑）",
]
addopts = "-m 'not live'"
