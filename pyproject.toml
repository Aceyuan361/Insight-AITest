[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "insight-eyes"
version = "1.0.0"
description = "移动设备性能监控工具 / Mobile Device Performance Monitoring Tool"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Aceyuan361", email = "594902674@qq.com"}
]
maintainers = [
    {name = "Aceyuan361", email = "594902674@qq.com"}
]
keywords = [
    "mobile",
    "monitoring",
    "performance",
    "android",
    "ios",
    "apm",
    "profiling"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Testing",
    "Topic :: System :: Monitoring",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
]
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "websockets>=14.0",
    "pydantic>=2.0",
    "sqlalchemy>=2.0.0",
    "pymobiledevice3>=7.0.0",
    "psutil>=6.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.28.0",
    "black>=24.0.0",
    "ruff>=0.8.0",
]

[project.urls]
Homepage = "https://github.com/Aceyuan361/Insight_eye"
Documentation = "https://github.com/Aceyuan361/Insight_eye/blob/1.0.0/docs"
Repository = "https://github.com/Aceyuan361/Insight_eye"
Issues = "https://github.com/Aceyuan361/Insight_eye/issues"

[project.scripts]
insight-eye-web = "insight_eyes:main"

[tool.setuptools]
packages = ["insight_eyes"]

[tool.setuptools.package-data]
"insight_eyes.web_frontend" = ["dist/**/*"]

[tool.black]
line-length = 100
target-version = ['py310', 'py311', 'py312']

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
