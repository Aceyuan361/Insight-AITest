name: CI

# v2.0.0 pipeline. Previous version targeted the deleted `web-frontend/` dir
# and never ran the pytest suite — this fixes both.
on:
  push:
    branches: [ main, "2.*", "feature/**" ]
  pull_request:
    branches: [ main, "2.*" ]

jobs:
  backend-test:
    name: Backend Tests (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.10'
          cache: 'pip'
      - name: Install dependencies (app + dev extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run pytest
        run: pytest tests/ -q

  backend-lint:
    name: Backend Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          # 与代码格式化环境对齐（black==24.10.0 已在 dev 依赖锁定版本）
          python-version: '3.12'
          cache: 'pip'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run Ruff (lint, fatal errors)
        run: ruff check insight_aitest/ --select E9,F63,F7,F82
      - name: Run Black (format check)
        run: black --check insight_aitest/

  frontend-build:
    name: Frontend Lint + Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: insight_aitest/shell-frontend
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: insight_aitest/shell-frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run ESLint
        run: npm run lint
      - name: Check hardcoded colors (design tokens only)
        run: npm run check:hex
      - name: Build (tsc + vite)
        run: npm run build

  frontend-e2e:
    name: Frontend E2E (Playwright)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: insight_aitest/shell-frontend
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python (backend for e2e)
        uses: actions/setup-python@v7
        with:
          python-version: '3.10'
      - name: Install backend
        run: |
          cd ../..
          python -m pip install --upgrade pip
          pip install -e .
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: insight_aitest/shell-frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build (tsc + vite)
        run: npm run build
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Run e2e (auto-boots backend :8001 + preview :4173)
        run: npx playwright test
        env:
          CI: '1'
      - name: Upload test artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: insight_aitest/shell-frontend/playwright-report/
          retention-days: 7
