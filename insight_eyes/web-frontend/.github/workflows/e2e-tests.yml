name: E2E Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  e2e-tests:
    name: E2E Tests (Chromium)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web-frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./web-frontend
        run: npm ci

      - name: Install Playwright Browsers
        working-directory: ./web-frontend
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        working-directory: ./web-frontend
        run: npm run test:e2e
        env:
          BASE_URL: http://localhost:5173

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: web-frontend/playwright-report/
          retention-days: 30

      - name: Upload test screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-screenshots
          path: web-frontend/screenshots/
          retention-days: 30

      - name: Upload test traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: web-frontend/test-results/
          retention-days: 30

      - name: Upload test results JSON
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results-json
          path: web-frontend/playwright-results.json
          retention-days: 30

      - name: Upload test results XML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results-xml
          path: web-frontend/playwright-results.xml
          retention-days: 30

      - name: Publish test results
        if: always()
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          files: web-frontend/playwright-results.xml
          check_name: E2E Test Results

      - name: Comment PR with results
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const results = JSON.parse(fs.readFileSync('./web-frontend/playwright-results.json', 'utf8'));
            const stats = results.stats;

            const comment = `## E2E Test Results

            | Metric | Count |
            |--------|-------|
            | Total Tests | ${stats.expected + stats.skipped} |
            | Passed | ${stats.expected} |
            | Failed | ${stats.unexpected} |
            | Skipped | ${stats.skipped} |
            | Duration | ${(stats.duration / 1000).toFixed(2)}s |

            ${stats.unexpected > 0 ? '❌ Some tests failed. Check the artifacts for details.' : '✅ All tests passed!'}

            [View full report](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})
            `;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });
